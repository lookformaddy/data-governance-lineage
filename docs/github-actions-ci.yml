# GitHub Actions CI for data-governance-lineage.
#
# NOTE: this file lives under docs/ as a ready-to-use template. To activate
# it, move it to .github/workflows/ci.yml in the repository. (Workflow files
# cannot be pushed by the GitHub App integration, which lacks the Workflows
# permission — hence the docs/ location.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite
        run: pytest -q

      - name: Smoke-test the demo
        run: python examples/run_demo.py > /dev/null

      - name: Build Docker image
        run: docker build -t data-governance-lineage:ci .
